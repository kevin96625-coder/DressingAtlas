<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DressingAtlas · 衣装图鉴数据库 | Costume Atlas</title>
  <meta name="description" id="metaDescription" content="AI 生成服装参考图库：1407 套原创服装、2814 张图像，按春季、夏季、秋季、冬季、内衣、派对、泳装、性感八个分类整理，支持编号与关键词检索，适用于 AI 绘画与角色设计参考。">
  <meta name="theme-color" content="#0e1013">
  <meta name="color-scheme" content="dark">
  <meta property="og:type" content="website">
  <meta property="og:title" content="DressingAtlas · 衣装图鉴">
  <meta property="og:description" content="1407 套 AI 生成服装参考，2814 张图像，八个分类。中文 / English / 日本語。">
  <meta property="og:site_name" content="DressingAtlas">
  <link rel="canonical" href="https://kevin96625-coder.github.io/DressingAtlas/">
  <meta property="og:url" content="https://kevin96625-coder.github.io/DressingAtlas/">
  <meta property="og:image" content="https://kevin96625-coder.github.io/DressingAtlas/og-cover.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="DressingAtlas · 衣装图鉴数据库">
  <meta name="twitter:description" content="1407 套服装 · 2814 张图像 · 中文 / English / 日本語">
  <meta name="twitter:image" content="https://kevin96625-coder.github.io/DressingAtlas/og-cover.jpg">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/app.css">
  <script type="module" src="assets/js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#gallery" data-i18n="skip">跳到图库</a>

  <header class="hero" id="top">
    <div class="hero__top">
      <p class="eyebrow" data-i18n="eyebrow">DressingAtlas ・ COSTUME DB ・ AI 绘画 / 角色设计服装参考</p>

      <div class="hero__tools">
        <div class="lang" id="langSwitch" role="group" aria-label="切换语言" data-i18n-aria="ariaLanguage">
          <button type="button" data-lang="zh" aria-pressed="true" aria-label="中文">中文</button>
          <button type="button" data-lang="en" aria-pressed="false" aria-label="English">EN</button>
          <button type="button" data-lang="ja" aria-pressed="false" aria-label="日本語">日本語</button>
        </div>

        <nav class="info" id="info" aria-label="使用提示与注意事项" data-i18n-aria="ariaInfo">
          <div class="info__tabs">
            <button type="button" class="info__tab" id="infoTabTips" data-panel="panelTips" aria-expanded="false" aria-controls="panelTips" data-i18n="tabTips">使用提示</button>
            <button type="button" class="info__tab" id="infoTabNotice" data-panel="panelNotice" aria-expanded="false" aria-controls="panelNotice" data-i18n="tabNotice">注意事项</button>
          </div>
          <section class="info__panel" id="panelTips" role="dialog" aria-labelledby="panelTipsTitle" tabindex="-1" hidden>
            <div class="info__head">
              <h2 id="panelTipsTitle" data-i18n="tipsTitle">使用提示</h2>
              <button type="button" class="info__close" data-close-panel aria-label="关闭" data-i18n-aria="closeInfo">×</button>
            </div>
            <ul data-i18n-list="tips"></ul>
          </section>
          <section class="info__panel" id="panelNotice" role="dialog" aria-labelledby="panelNoticeTitle" tabindex="-1" hidden>
            <div class="info__head">
              <h2 id="panelNoticeTitle" data-i18n="noticesTitle">注意事项</h2>
              <button type="button" class="info__close" data-close-panel aria-label="关闭" data-i18n-aria="closeInfo">×</button>
            </div>
            <ul data-i18n-list="notices"></ul>
          </section>
        </nav>
      </div>
    </div>

    <h1><span class="hero__mark" data-i18n="h1a">衣装图鉴</span> <span data-i18n="h1b">数据库</span></h1>
    <p class="hero__sub" data-i18n="heroSub">不含人物的服装参考图（2:3）。春季、夏季、秋季、冬季、内衣、派对、泳装、性感八个分类，方便按主题浏览与关键词检索。</p>
  </header>

  <div class="toolbar" id="toolbar">
    <div class="toolbar__inner">
      <nav class="cats" id="categoryTabs" aria-label="按分类筛选" data-i18n-aria="ariaCategory"></nav>

      <div class="controls">
        <label class="search" for="searchInput">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="searchInput" type="search" placeholder="搜索编号、分类或关键词（如 denim、lace）" autocomplete="off" spellcheck="false" aria-label="搜索编号、分类或服装关键词" data-i18n-placeholder="searchPlaceholder" data-i18n-aria="ariaSearch">
        </label>

        <button type="button" class="filter-toggle" id="filterToggle" aria-expanded="false" aria-controls="filters">
          <span data-i18n="filter">筛选</span><b id="filterBadge" hidden></b>
        </button>

        <div class="filters" id="filters">
          <label class="select" for="categorySelect">
            <span class="sr-only" data-i18n="metaCategory">分类</span>
            <select id="categorySelect"></select>
            <svg class="select__chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </label>
          <button type="button" class="button button--ghost" id="clearFiltersBar" data-i18n="clearFilters">清除筛选</button>
        </div>

        <p class="count" id="resultCount" aria-live="polite"></p>
      </div>
    </div>
  </div>

  <main class="main" id="gallery">
    <div class="grid" id="grid" aria-busy="true"></div>
    <div class="empty" id="empty" hidden>
      <p class="empty__title" data-i18n="emptyTitle">没有匹配的服装</p>
      <p class="empty__text" data-i18n="emptyText">换一个关键词，或清除当前的筛选条件。</p>
      <button type="button" class="button button--ghost" id="clearFilters" data-i18n="clearFilters">清除筛选</button>
    </div>
    <noscript>
      <p class="empty__title">需要启用 JavaScript 才能浏览图库。</p>
    </noscript>
  </main>

  <footer class="footer">
    <div class="footer__card">
      <p class="footer__lead" data-i18n="footerLead">DressingAtlas · 衣装图鉴 COSTUME ATLAS</p>
      <p data-i18n-html="footerCredits"></p>
      <p data-i18n="footerLicense"></p>
      <p class="footer__meta" id="footerMeta"></p>
    </div>
  </footer>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-label="大图预览" data-i18n-aria="modalAria" hidden>
    <div class="modal__scrim" data-close-modal></div>
    <div class="modal__box">
      <button type="button" class="modal__close" id="modalClose" aria-label="关闭大图" data-i18n-aria="modalClose">×</button>

      <div class="viewer">
        <div class="viewer__stage" id="viewerStage">
          <img class="viewer__ghost" id="viewerGhost" alt="" aria-hidden="true">
          <img class="viewer__image" id="viewerImage" alt="">
          <div class="viewer__spinner" id="viewerSpinner" aria-hidden="true"></div>
          <p class="viewer__error" id="viewerError" data-i18n="imageError" hidden>原图加载失败</p>
        </div>
        <button type="button" class="viewer__nav viewer__nav--prev" id="prevItem" aria-label="上一套" data-i18n-aria="prevItem">‹</button>
        <button type="button" class="viewer__nav viewer__nav--next" id="nextItem" aria-label="下一套" data-i18n-aria="nextItem">›</button>
      </div>

      <aside class="panel">
        <div class="panel__head">
          <h2 id="modalTitle"></h2>
          <p class="panel__id" id="modalId"></p>
        </div>

        <dl class="panel__meta" id="modalMeta"></dl>

        <p class="panel__prompt" id="modalPrompt"></p>

        <div class="panel__actions">
          <button type="button" class="button" id="copyPrompt">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            <span data-i18n="copyPrompt">复制关键词</span>
          </button>
          <a class="button button--accent" id="downloadLink" href="#" download>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3v12m0 0 4.5-4.5M12 15l-4.5-4.5M4 20h16"/></svg>
            <span data-i18n="download">下载原图（WebP）</span>
          </a>
        </div>

        <p class="panel__note" data-i18n="downloadNote"></p>
        <p class="panel__original"><a id="originalLink" href="#" target="_blank" rel="noopener noreferrer" data-i18n="originalLink">原站 PNG</a></p>

        <p class="panel__keys" data-i18n-html="keysHint"></p>
      </aside>
    </div>
  </div>
</body>
</html>
